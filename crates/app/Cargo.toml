[package]
name = "desktop-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "desktop-rs"
path = "src/main.rs"

[features]
# Headless PNG rendering of the real UI for visual checks without a display:
#   cargo run --features snapshot -- --snapshot out.png <repo> [changes|history|repos|branches|welcome]
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu"]

[dependencies]
gpui_wgpu = { workspace = true, optional = true, features = ["test-support"] }
gd-git.workspace = true
gd-ui.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_elements.workspace = true
anyhow.workspace = true
notify.workspace = true
dirs.workspace = true
smol.workspace = true
log.workspace = true
env_logger.workspace = true
gd-syntax.workspace = true

# Wayland/X11 backends are only meaningful (and only build) on Linux.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
